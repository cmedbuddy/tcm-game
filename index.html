<script>
// 防刷新的手勢監聽加強防護
document.addEventListener('touchmove', function(e) {
  if (e.scale !== 1) { e.preventDefault(); }
}, { passive: false });

// 音效系統 (Web Audio API)
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'click') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(164.81, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'lifeline') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'win') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.12);
      osc.frequency.setValueAtTime(783.99, now + 0.24);
      osc.frequency.setValueAtTime(1046.50, now + 0.36);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch(e) {}
}

function toggleLanguage() {
  playSound('click');
  currentLang = (currentLang === 'zh') ? 'en' : 'zh';
  document.getElementById("lang-btn").innerText = (currentLang === 'zh') ? 'English' : '中文';
  updateStaticUI();
  showSelectScreen();

function updateStaticUI() {
  const t = i18n[currentLang];
  document.getElementById("txt-header").innerText = t.header;
  document.getElementById("txt-select-title").innerText = t.selectTitle;
  document.getElementById("txt-l-audience").innerText = t.audBtn;
  document.getElementById("txt-l-phone").innerText = t.phoneBtn;
  document.getElementById("txt-cashout").innerText = t.cashoutBtn;
  document.getElementById("txt-btn-back").innerText = t.backBtn;
  document.getElementById("txt-btn-next").innerText = t.nextBtn;
  document.getElementById("txt-btn-share").innerText = t.shareBtn;
}

function renderStageList() {
  const container = document.getElementById("stages-list");
  container.innerHTML = "";
  const list = stagesData[currentLang];
  
  list.forEach((stg, idx) => {
    const card = document.createElement("div");
    card.className = "stage-card";
    card.onclick = () => startStage(idx);
    card.innerHTML = `<div class="stage-title">${stg.name}</div><div class="stage-desc">${stg.desc}</div>`;
    container.appendChild(card);
  });
}

function showSelectScreen() {
  playSound('click');
  document.getElementById("modal").style.display = "none";
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("level-select-screen").style.display = "block";
  renderStageList();
}

function startStage(stageIdx) {
  playSound('click');
  currentStageIndex = stageIdx;
  currentQuestionIndex = 0;
  currentPrize = 0;
  lastCheckpointPrize = 0;
  bodyTestScores = {};

  const stage = stagesData[currentLang][currentStageIndex];
  
  document.getElementById("l-5050").disabled = stage.isBodyTest || false;
  document.getElementById("l-audience").disabled = stage.isBodyTest || false;
  document.getElementById("l-phone").disabled = stage.isBodyTest || false;

  document.getElementById("level-select-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  
  document.getElementById("npc-dialog").innerText = `${i18n[currentLang].npcReady} (${stage.name})`;
  loadQuestion();
}

function loadQuestion() {
  const t = i18n[currentLang];
  const stage = stagesData[currentLang][currentStageIndex];
  const q = stage.questions[currentQuestionIndex];
  
  document.getElementById("question-text").innerText = q.q;
  document.getElementById("level-display").innerText = `${t.progressLabel}: ${currentQuestionIndex + 1} / ${stage.questions.length}`;
  
  if (stage.isBodyTest) {
    document.getElementById("prize-display").innerText = "體質分析中...";
  } else {
    document.getElementById("prize-display").innerText = `${t.prizeLabel}: ${currentPrize} ${t.unit}`;
  }
  
  const container = document.getElementById("options-container");
  container.innerHTML = "";
  
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(idx);
    container.appendChild(btn);
  });
}

function checkAnswer(selected) {
  const t = i18n[currentLang];
  const stage = stagesData[currentLang][currentStageIndex];
  const q = stage.questions[currentQuestionIndex];
  
  if (stage.isBodyTest) {
    playSound('click');
    let points = 0;
    if (selected === 0) points = 3;
    else if (selected === 1) points = 2;
    else if (selected === 2) points = 1;
    else points = 0;

    bodyTestScores[q.type] = (bodyTestScores[q.type] || 0) + points;

    currentQuestionIndex++;
    if (currentQuestionIndex >= stage.questions.length) {
      finishBodyTest();
    } else {
      loadQuestion();
    }
    return;
  }

  if (selected === q.ans) {
    playSound('correct');
    currentPrize = prizes[currentQuestionIndex];
    if (currentQuestionIndex === 3) lastCheckpointPrize = prizes[3];
    
    currentQuestionIndex++;
    if (currentQuestionIndex >= stage.questions.length) {
      playSound('win');
      endGame(true, `${t.winMsg}${stage.name}!`, stage.titleSuccess);
    } else {
      document.getElementById("npc-dialog").innerText = `${t.npcCorrect}${currentPrize} ${t.unit}!`;
      loadQuestion();
    }
  } else {
    playSound('wrong');
    endGame(false, `${t.loseMsg}${q.options[q.ans]}.`, t.titleFail);
  }
}

function finishBodyTest() {
  playSound('win');
  let topType = "平和質";
  let maxScore = -1;
  for (let type in bodyTestScores) {
    if (bodyTestScores[type] > maxScore) {
      maxScore = bodyTestScores[type];
      topType = type;
    }
  }

  const info = bodyTypeInfo[topType] || bodyTypeInfo["平和質"];
  const descText = (currentLang === 'zh') ? info.desc : info.descEn;

  const resultMsg = `【中醫九種體質鑑定結果】\n\n經 33 題標準量表測算，你的主要體質傾向為：【${topType}】！\n\n${descText}`;
  endGame(true, resultMsg, `${topType}體質`);
}

function use5050() {
  playSound('lifeline');
  const q = stagesData[currentLang][currentStageIndex].questions[currentQuestionIndex];
  const btns = document.querySelectorAll(".option-btn");
  let removed = 0;
  btns.forEach((btn, idx) => {
    if (idx !== q.ans && removed < 2) {
      btn.style.visibility = "hidden";
      removed++;
    }
  });
  document.getElementById("l-5050").disabled = true;
  document.getElementById("npc-dialog").innerText = i18n[currentLang].npc5050;
}

function useAudience() {
  playSound('lifeline');
  const q = stagesData[currentLang][currentStageIndex].questions[currentQuestionIndex];
  const optLetter = ["A","B","C","D"][q.ans];
  document.getElementById("npc-dialog").innerText = `${i18n[currentLang].npcAud}${optLetter}!`;
  document.getElementById("l-audience").disabled = true;
}

function usePhone() {
  playSound('lifeline');
  const q = stagesData[currentLang][currentStageIndex].questions[currentQuestionIndex];
  document.getElementById("npc-dialog").innerText = `${i18n[currentLang].npcPhone}${q.options[q.ans]}!`;
  document.getElementById("l-phone").disabled = true;
}

function cashOut() {
  playSound('win');
  const t = i18n[currentLang];
  if (currentPrize === 0) {
    alert(t.cashoutAlert);
    return;
  }
  endGame(true, `見好就收！安全帶走 ${currentPrize} ${t.unit}！`, t.cashoutTitle);
}

function endGame(isWin, msg, title) {
  const t = i18n[currentLang];
  const stage = stagesData[currentLang][currentStageIndex];
  finalScore = isWin ? currentPrize : lastCheckpointPrize;
  playerTitle = title;
  
  document.getElementById("modal-title").innerText = isWin ? t.winTitle : t.loseTitle;
  
  if (stage.isBodyTest) {
    document.getElementById("modal-text").innerText = `${msg}`;
  } else {
    document.getElementById("modal-text").innerText = `${msg}\n\n${t.prizeLabel}: ${finalScore} ${t.unit}\n獲得榮譽: 【${playerTitle}】`;
  }
  
  const nextBtn = document.getElementById("next-stage-btn");
  if (isWin && currentStageIndex < stagesData[currentLang].length - 1 && !stage.isBodyTest) {
    nextBtn.style.display = "inline-block";
  } else {
    nextBtn.style.display = "none";
  }
  
  document.getElementById("modal").style.display = "flex";
}

function nextStage() {
  playSound('click');
  document.getElementById("modal").style.display = "none";
  startStage(currentStageIndex + 1);
}

function copyResult() {
  playSound('click');
  const t = i18n[currentLang];
  const stageName = stagesData[currentLang][currentStageIndex].name;
  const currentUrl = window.location.href;
  
  let text = "";
  if (currentLang === 'zh') {
    text = `我在《懸壺濟世：百萬問答》的【${stageName}】獲得了【${playerTitle}】！\n快來挑戰中醫知識與 33 題體質測驗：${currentUrl}`;
  } else {
    text = `I completed [${stageName}] in TCM Millionaire Quiz and earned title: 【${playerTitle}】!\nChallenge here: ${currentUrl}`;
  }
  
  navigator.clipboard.writeText(text).then(() => {
    alert(t.shareAlert);
  }).catch(() => {
    alert("複製失敗，請手動複製網址分享！");
  });
}

// 初始化
updateStaticUI();
showSelectScreen();
</script>
